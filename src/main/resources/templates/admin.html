<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">
<header class="container-fluid bg-dark text-white">
    <div class="row align-items-center py-2">

        <div class="col">
            <strong th:text="${admin.email}">
                admin@mail.com
            </strong>

            <span>
                with roles:
            </span>

            <span th:each="role : ${admin.roles}"
                  th:text="${role.name + ' '}">
            </span>
        </div>

        <div class="col-auto">
            <form th:action="@{/logout}" method="post">
                <button type="submit"
                        class="btn btn-link nav-link text-white-50">
                    Logout
                </button>
            </form>
        </div>

    </div>
</header>
<main class="container-fluid">
    <div class="row">


        <!-- LEFT MENU -->
        <aside class="col-2 bg-white min-vh-100 p-0">
            <div class="list-group rounded-0">
                <a href="#adminPanel"
                   class="list-group-item list-group-item-action active border-0"
                   data-bs-toggle="tab">
                    Admin
                </a>
                <a href="#userPanel"
                   class="list-group-item list-group-item-action border-0"
                   data-bs-toggle="tab">
                    User
                </a>
            </div>
        </aside>


        <!-- CONTENT -->
        <section class="col-10 bg-light min-vh-100">
            <div class="tab-content">


                <!-- ADMIN PANEL -->
                <div class="tab-pane fade show active"
                     id="adminPanel">
                    <div class="pt-3">
                        <h2 class="mb-4">
                            Admin panel
                        </h2>

                        <!-- TABS -->
                        <ul class="nav nav-tabs">
                            <li class="nav-item">
                                <a class="nav-link active"
                                   data-bs-toggle="tab"
                                   href="#userTable">
                                    User table
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link"
                                   data-bs-toggle="tab"
                                   href="#newUser">
                                    New User
                                </a>
                            </li>
                        </ul>
                        <div class="tab-content mt-3">


                            <!-- USER TABLE -->
                            <div class="tab-pane fade show active"
                                 id="userTable">
                                <div class="card border-0 shadow-sm">
                                    <div class="card-header">
                                        <h5 class="mb-0">
                                            All users
                                        </h5>
                                    </div>
                                    <div class="card-body">
                                        <table class="table table-hover align-middle text-center">
                                            <thead class="table-light">
                                            <tr>
                                                <th>
                                                    Name
                                                </th>
                                                <th>
                                                    Age
                                                </th>
                                                <th>
                                                    Email
                                                </th>
                                                <th>
                                                    Role
                                                </th>
                                                <th>
                                                    Edit
                                                </th>
                                                <th>
                                                    Delete
                                                </th>
                                            </tr>
                                            </thead>
                                            <tbody>
                                            <tr th:each="user : ${userList}">
                                                <td th:text="${user.name}">
                                                    Name
                                                </td>
                                                <td th:text="${user.age}">
                                                    Age
                                                </td>
                                                <td th:text="${user.email}">
                                                    Email
                                                </td>
                                                <td>
                                                    <span th:each="role : ${user.roles}"
                                                          th:text="${role.name + ' '}">
                                                    </span>
                                                </td>
                                                <td>
                                                    <button class="btn btn-info"
                                                            data-bs-toggle="modal"
                                                            data-bs-target="#editModal"

                                                            th:data-id="${user.id}"
                                                            th:data-name="${user.name}"
                                                            th:data-age="${user.age}"
                                                            th:data-email="${user.email}"
                                                            th:data-login="${user.login}"
                                                            th:data-roles="${user.roles.![id]}">
                                                        Edit
                                                    </button>
                                                </td>
                                                <td>
                                                    <button type="button"
                                                            class="btn btn-danger"
                                                            data-bs-toggle="modal"
                                                            data-bs-target="#deleteModal"
                                                            th:data-id="${user.id}"
                                                            th:data-name="${user.name}"
                                                            th:data-email="${user.email}"
                                                            th:data-age="${user.age}"
                                                            th:data-login="${user.login}">
                                                        Delete
                                                    </button>
                                                </td>
                                            </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>

                            <!-- NEW USER -->
                            <div class="tab-pane fade" id="newUser">
                                <div class="card border-0 shadow-sm">
                                    <div class="card-header">
                                        <h5 class="mb-0">
                                            Add new user
                                        </h5>
                                    </div>
                                    <div class="card-body">
                                        <div class="row justify-content-center">
                                            <div class="col-lg-5">
                                                <form th:action="@{/admin/add}"
                                                      th:object="${user}"
                                                      method="post">
                                                    <div class="mb-3">
                                                        <label class="form-label fw-bold">
                                                            Name
                                                        </label>
                                                        <input type="text"
                                                               class="form-control"
                                                               th:field="*{name}"
                                                               placeholder="Name">
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label fw-bold">
                                                            Age
                                                        </label>
                                                        <input type="number"
                                                               class="form-control"
                                                               th:field="*{age}"
                                                               placeholder="Age">
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label fw-bold">
                                                            Email
                                                        </label>
                                                        <input type="email"
                                                               class="form-control"
                                                               th:field="*{email}"
                                                               placeholder="Email">
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label fw-bold">
                                                            Login
                                                        </label>
                                                        <input type="text"
                                                               class="form-control"
                                                               th:field="*{login}"
                                                               placeholder="Login">
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label fw-bold">
                                                            Password
                                                        </label>
                                                        <input type="password"
                                                               class="form-control"
                                                               th:field="*{password}"
                                                               placeholder="Password">
                                                    </div>
                                                    <div class="mb-4">
                                                        <label class="form-label fw-bold">
                                                            Role
                                                        </label>
                                                        <select class="form-select"
                                                                th:field="*{roles}"
                                                                multiple
                                                                size="2">
                                                            <option th:each="role : ${allRoles}"
                                                                    th:value="${role.id}"
                                                                    th:text="${role.name}">
                                                            </option>
                                                        </select>
                                                    </div>
                                                    <div class="text-center">
                                                        <button type="submit"
                                                                class="btn btn-success">
                                                            Add new user
                                                        </button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- USER PANEL -->
                <div class="tab-pane fade" id="userPanel">
                    <div class="container-fluid px-4 py-3">
                        <h1>User information-page</h1>
                        <div class="card">
                            <div class="card-header py-3">
                                <div class="h4 m-0">About user</div>
                            </div>
                            <div class="card-body">
                                <table class="table table-striped border-top">
                                    <thead>
                                    <tr>
                                        <th scope="col">Name</th>
                                        <th scope="col">Age</th>
                                        <th scope="col">Email</th>
                                        <th scope="col">Role</th>
                                    </tr>
                                    </thead>
                                    <tbody id="adminInfo"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </section>
    </div>
</main>

<!-- EDIT MODAL -->
<div class="modal fade" id="editModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    Edit user
                </h5>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>
            </div>
            <div class="modal-body">
                <form id="editForm" method="post">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">
                    <input type="hidden"
                           id="editId"
                           name="id">
                    <div class="mb-3">
                        <label class="form-label">
                            Name
                        </label>
                        <input id="editName"
                               class="form-control"
                               name="name"
                               type="text">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Age
                        </label>
                        <input id="editAge"
                               class="form-control"
                               name="age"
                               type="number">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Email
                        </label>
                        <input id="editEmail"
                               class="form-control"
                               name="email"
                               type="email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Login
                        </label>
                        <input id="editLogin"
                               class="form-control"
                               name="login"
                               type="text">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Password
                        </label>
                        <input id="editPassword"
                               class="form-control"
                               name="password"
                               type="password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Role
                        </label>
                        <select id="editRoles"
                                class="form-select"
                                name="roles"
                                multiple
                                size="2">
                            <option th:each="role : ${allRoles}"
                                    th:value="${role.id}"
                                    th:text="${role.name}">
                            </option>
                        </select>
                    </div>
                    <button type="submit"
                            class="btn btn-primary">
                        Save changes
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>


<!-- Delete User Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <!-- Header -->
            <div class="modal-header">
                <h5 class="modal-title" id="deleteModalLabel">Delete user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- Body -->
            <div class="modal-body">
                <form id="deleteUserForm" method="post">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">
                    <!-- ID (hidden) -->
                    <input type="hidden" id="deleteUserId" name="id">

                    <!-- Name -->
                    <div class="mb-3 row">
                        <div class="col-lg-7 mx-auto d-flex flex-column align-items-center">
                            <label for="deleteName" class="form-label fw-bold">Name</label>
                            <input type="text" class="form-control bg-light" id="deleteName" name="name" readonly>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="mb-3 row">
                        <div class="col-lg-7 mx-auto d-flex flex-column align-items-center">
                            <label for="deleteEmail" class="form-label fw-bold">Email</label>
                            <input type="email" class="form-control bg-light" id="deleteEmail" name="email" readonly>
                        </div>
                    </div>

                    <!-- Age -->
                    <div class="mb-3 row">
                        <div class="col-lg-7 mx-auto d-flex flex-column align-items-center">
                            <label for="deleteAge" class="form-label fw-bold">Age</label>
                            <input type="number" class="form-control bg-light" id="deleteAge" name="age" readonly>
                        </div>
                    </div>

                    <!-- Login -->
                    <div class="mb-3 row">
                        <div class="col-lg-7 mx-auto d-flex flex-column align-items-center">
                            <label for="deleteLogin" class="form-label fw-bold">Login</label>
                            <input type="text" class="form-control bg-light" id="deleteLogin" name="login" readonly>
                        </div>
                    </div>

                    <!-- Roles -->
                    <div class="mb-3 row">
                        <div class="col-lg-7 mx-auto d-flex flex-column align-items-center">
                            <label for="deleteRoles" class="form-label fw-bold">Role</label>
                            <select id="deleteRoles" class="form-select bg-light" size="2" name="roles"
                                    style="width: 100%;" disabled>
                                <option value="1">USER</option>
                                <option value="2">ADMIN</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Footer -->
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="submit" form="deleteUserForm" class="btn btn-primary">Delete</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="/js/admin.js"></script>

</body>
</html>
