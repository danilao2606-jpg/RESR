<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <meta charset="UTF-8">
    <title>Admin</title>
</head>
<body>
<h1>Admin controller</h1>

<table border="1">
    <thead>
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Age</th>
        <th>Role</th>
        <th>Delete</th>
        <th>Update</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${userList}">
        <td th:text="${user.name}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.age}"></td>
        <td>
            <span th:each="role, iterStat : ${user.roles}">
                <span th:text="${role.name}"></span>
                <span th:if="${!iterStat.last}">, </span>
            </span>
        </td>
        <td>
            <form method="post" th:action="@{/admin/delete/{id}(id=${user.id})}" style="display: inline;">
                <button type="submit">Del</button>
            </form>
        </td>
        <td>
            <a th:href="@{/admin/admin-update/{id}(id=${user.id})}">
                <button type="button">Update</button>
            </a>
        </td>
    </tr>
    </tbody>
</table>

<h2>Add New User</h2>
<form th:method="POST" th:action="@{/admin/add}" th:object="${user}">

    <label for="name">Name:</label>
    <input type="text" th:field="*{name}" id="name"/>
    <div style="color:red" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</div>
    <br/>

    <label for="email">Email:</label>
    <input type="email" th:field="*{email}" id="email"/>
    <div style="color:red" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email Error</div>
    <br/>

    <label for="age">Age:</label>
    <input type="number" th:field="*{age}" id="age"/>
    <div style="color:red" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Age Error</div>
    <br/>

    <label for="login">Login:</label>
    <input type="text" th:field="*{login}" id="login"/>
    <div style="color:red" th:if="${#fields.hasErrors('login')}" th:errors="*{login}">Login Error</div>
    <br/>

    <label for="password">Password:</label>
    <input type="password" th:field="*{password}" id="password"/>
    <div style="color:red" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password Error</div>
    <br/>

    <div class="form-group">
        <label>Roles:</label>
        <div th:each="role : ${allRoles}" class="form-check form-check-inline">
            <input type="checkbox"
                   class="form-check-input"
                   th:field="*{roles}"
                   th:value="${role.id}"
                   th:id="'role_' + ${role.id}"/>
            <label class="form-check-label"
                   th:for="'role_' + ${role.id}"
                   th:text="${role.name}"></label>
        </div>
    </div>


    <button type="submit">Save</button>
</form>

<table border="1">
    <thead>
    <tr>
        <th>Exit</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td>
            <form th:action="@{/logout}" method="post">
                <button type="submit">Exit</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>



</body>
</html>
