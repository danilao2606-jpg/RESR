<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">
<header class="container-fluid bg-dark text-white">
    <div class="row align-items-center py-2">
        <div class="col">
            <strong id="adminEmail"></strong>
            <span> with roles: </span>
            <span id="adminRole"></span>
        </div>
        <div class="col-auto">
            <a href="/logout"
               class="nav-link text-white-50">
                Logout
            </a>
        </div>
    </div>
</header>
<main class="container-fluid">
    <div class="row">
        <aside class="col-2 bg-white min-vh-100 p-0">
            <div class="list-group rounded-0">
                <a href="#adminPanel"
                   class="list-group-item list-group-item-action active border-0"
                   data-bs-toggle="list">
                    Admin
                </a>
                <a href="#userPanel"
                   class="list-group-item list-group-item-action border-0"
                   data-bs-toggle="list">
                    User
                </a>
            </div>
        </aside>
        <section class="col-10 bg-light min-vh-100">
            <div class="tab-content">


                <!-- ================= ADMIN PANEL ================= -->
                <div class="tab-pane fade show active"
                     id="adminPanel">
                    <div class="pt-3">
                        <h2 class="mb-4">
                            Admin panel
                        </h2>
                        <ul class="nav nav-tabs">
                            <li class="nav-item">
                                <a class="nav-link active"
                                   id="adminTable"
                                   data-bs-toggle="tab"
                                   href="#userTable">
                                    User table
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link"
                                   data-bs-toggle="tab"
                                   href="#newUser">
                                    New User
                                </a>
                            </li>
                        </ul>
                        <div class="tab-content mt-3">

                            <!-- USER TABLE -->
                            <div class="tab-pane fade show active"
                                 id="userTable">
                                <div class="card border-0 shadow-sm">
                                    <div class="card-header">
                                        <h5 class="mb-0">
                                            All users
                                        </h5>
                                    </div>
                                    <div class="card-body">
                                        <table class="table table-hover align-middle text-center">
                                            <thead class="table-light">
                                            <tr>
                                                <th>Name</th>
                                                <th>Age</th>
                                                <th>Email</th>
                                                <th>Role</th>
                                                <th>Edit</th>
                                                <th>Delete</th>
                                            </tr>
                                            </thead>
                                            <tbody id="allUsers">
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>

                            <!-- ================= NEW USER ================= -->
                            <div class="tab-pane fade"
                                 id="newUser">
                                <div class="card border-0 shadow-sm">
                                    <div class="card-header">
                                        <h5 class="mb-0">
                                            Add new user
                                        </h5>
                                    </div>
                                    <div class="card-body">
                                        <div class="row justify-content-center">
                                            <div class="col-lg-5">
                                                <form id="formCreateNewUser">
                                                    <div class="mb-3">
                                                        <label for="new_name"
                                                               class="form-label fw-bold">
                                                            Name
                                                        </label>
                                                        <input
                                                                type="text"
                                                                class="form-control"
                                                                id="new_name"
                                                                name="new_name"
                                                                placeholder="Name">
                                                    </div>
                                                    <div class="mb-3">
                                                        <label for="new_age"
                                                               class="form-label fw-bold">
                                                            Age
                                                        </label>
                                                        <input
                                                                type="number"
                                                                class="form-control"
                                                                id="new_age"
                                                                name="new_age"
                                                                placeholder="Age">
                                                    </div>
                                                    <div class="mb-3">
                                                        <label for="new_email"
                                                               class="form-label fw-bold">
                                                            Email
                                                        </label>
                                                        <input
                                                                type="email"
                                                                class="form-control"
                                                                id="new_email"
                                                                name="new_email"
                                                                placeholder="Email">
                                                    </div>
                                                    <div class="mb-3">
                                                        <label for="new_login"
                                                               class="form-label fw-bold">
                                                            Login
                                                        </label>
                                                        <input
                                                                type="text"
                                                                class="form-control"
                                                                id="new_login"
                                                                name="new_login"
                                                                placeholder="Login">
                                                    </div>
                                                    <div class="mb-3">
                                                        <label for="new_password"
                                                               class="form-label fw-bold">
                                                            Password
                                                        </label>
                                                        <input
                                                                type="password"
                                                                class="form-control"
                                                                id="new_password"
                                                                name="new_password"
                                                                placeholder="Password">
                                                    </div>
                                                    <div class="mb-4">
                                                        <label for="new_role"
                                                               class="form-label fw-bold">
                                                            Role
                                                        </label>
                                                        <select
                                                                id="new_role"
                                                                name="new_role"
                                                                class="form-select"
                                                                multiple
                                                                size="2">
                                                            <option value="1">
                                                                USER
                                                            </option>
                                                            <option value="2">
                                                                ADMIN
                                                            </option>
                                                        </select>
                                                    </div>
                                                    <div class="text-center">
                                                        <button
                                                                type="submit"
                                                                class="btn btn-success">
                                                            Add new user
                                                        </button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ================= USER PANEL ================= -->
                    <div class="tab-pane fade"
                         id="userPanel">
                        <div class="pt-3">
                            <h2 class="mb-4">
                                User information page
                            </h2>
                            <div class="card shadow-sm border-0">
                                <div class="card-header">
                                    <h5 class="mb-0">
                                        About user
                                    </h5>
                                </div>
                                <div class="card-body">
                                    <table class="table table-striped align-middle">
                                        <thead class="table-light">
                                        <tr>
                                            <th>Name</th>
                                            <th>Age</th>
                                            <th>Email</th>
                                            <th>Role</th>
                                        </tr>
                                        </thead>
                                        <tbody id="adminInfo">
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ================= EDIT MODAL ================= -->
                    <div class="modal fade"
                         id="modalEdit"
                         tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">
                                        Edit user
                                    </h5>
                                    <button
                                            type="button"
                                            class="btn-close"
                                            data-bs-dismiss="modal">
                                    </button>
                                </div>
                                <div class="modal-body">
                                    <form id="formEditUser">
                                        <input type="hidden"
                                               id="editUserId"
                                               name="editUserId">
                                        <div class="mb-3">
                                            <label class="form-label">
                                                Name
                                            </label>
                                            <input
                                                    type="text"
                                                    class="form-control"
                                                    id="editName"
                                                    name="editName">
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">
                                                Age
                                            </label>
                                            <input
                                                    type="number"
                                                    class="form-control"
                                                    id="editAge"
                                                    name="editAge">
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">
                                                Email
                                            </label>
                                            <input
                                                    type="email"
                                                    class="form-control"
                                                    id="editEmail"
                                                    name="editEmail">
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">
                                                Login
                                            </label>
                                            <input
                                                    type="text"
                                                    class="form-control"
                                                    id="editLogin"
                                                    name="editLogin">
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">
                                                Password
                                            </label>
                                            <input
                                                    type="password"
                                                    class="form-control"
                                                    id="editPassword"
                                                    name="editPassword">
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">
                                                Role
                                            </label>
                                            <select
                                                    id="editRoles"
                                                    class="form-select"
                                                    multiple
                                                    size="2">
                                                <option value="1">
                                                    USER
                                                </option>
                                                <option value="2">
                                                    ADMIN
                                                </option>
                                            </select>
                                        </div>
                                        <div class="text-center">
                                            <button
                                                    type="submit"
                                                    class="btn btn-primary">
                                                Save changes
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ================= DELETE MODAL ================= -->
                    <div class="modal fade"
                         id="modalDelete"
                         tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">
                                        Delete user
                                    </h5>
                                    <button
                                            type="button"
                                            class="btn-close"
                                            data-bs-dismiss="modal">
                                    </button>
                                </div>
                                <div class="modal-body">
                                    <form id="formDeleteUser">
                                        <input type="hidden"
                                               id="deleteUserId">
                                        <div class="mb-3">
                                            <label class="form-label">
                                                Name
                                            </label>
                                            <input
                                                    type="text"
                                                    class="form-control"
                                                    id="deleteName"
                                                    readonly>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">
                                                Age
                                            </label>
                                            <input
                                                    type="number"
                                                    class="form-control"
                                                    id="deleteAge"
                                                    readonly>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">
                                                Email
                                            </label>
                                            <input
                                                    type="email"
                                                    class="form-control"
                                                    id="deleteEmail"
                                                    readonly>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">
                                                Login
                                            </label>
                                            <input
                                                    type="text"
                                                    class="form-control"
                                                    id="deleteLogin"
                                                    readonly>
                                        </div>
                                        <div class="text-center">
                                            <button
                                                    type="submit"
                                                    class="btn btn-danger">
                                                Delete
                                            </button>
                                            <button
                                                    type="button"
                                                    class="btn btn-secondary"
                                                    data-bs-dismiss="modal">
                                                Cancel
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
