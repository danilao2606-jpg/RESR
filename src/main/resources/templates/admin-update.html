<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>User.update.0=)</title>
</head>
<body>
<h2>Edit user</h2>
<form method="post" th:action="@{/admin/admin-update/{id}(id=${user.id})}" th:object="${user}">

    <label for="name">Name:</label>
    <input type="text" th:field="*{name}" id="name"/>
    <div style="color:red" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</div>
    <br/>

    <label for="email">Email:</label>
    <input type="email" th:field="*{email}" id="email"/>
    <div style="color:red" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email Error</div>
    <br/>

    <label for="age">Age:</label>
    <input type="number" th:field="*{age}" id="age"/>
    <div style="color:red" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Age Error</div>
    <br/>

    <label for="login">Login:</label>
    <input type="text" th:field="*{login}" id="login"/>
    <div style="color:red" th:if="${#fields.hasErrors('login')}" th:errors="*{login}">Login Error</div>
    <br/>

    <label for="password">Password:</label>
    <input type="password" th:field="*{password}" id="password"/>
    <div style="color:red" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password Error</div>
    <br/>

    <div class="form-group">
        <label>Roles:</label>
        <div th:each="role : ${allRoles}" class="form-check form-check-inline">
            <input type="checkbox"
                   class="form-check-input"
                   th:field="*{roles}"
                   th:value="${role.id}"
                   th:id="'role_' + ${role.id}"/>
            <label class="form-check-label"
                   th:for="'role_' + ${role.id}"
                   th:text="${role.name}"></label>
        </div>
    </div>

    <button type="submit">Update</button>
</form>
<a href="/admin">Cancel</a>
</body>
</html>
